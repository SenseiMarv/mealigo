name: Task
description: A general piece of work
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      placeholder: |
        e.g.
        - Search queries the connected Mealie server and lists matching recipes
        - An empty query shows recent recipes instead of an error
        - A failed request shows an inline error with a retry action
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
    validations:
      required: false
